# Local event context. Fill from published service descriptions/API documentation.
name = "@SERVICE@"
service_workspaces = []
initial_workers = 5
max_workers = 20
startup_roles = ["ctf-flagkeeper", "ctf-traffic", "ctf-docker-logs", "ctf-code-review", "ctf-poc-dev"]

[flags]
database = "flags/ledger.sqlite3"
submission_mode = "hold_until_signal"
# Configure only after checking the published event API; scripts/submit-http.py
# is usable only when its request/receipt contract matches that API.
adapter = "unconfigured"
tick_seconds = 120
lifetime_ticks = 5
safety_margin_seconds = 30
# Never infer expiry from capture time; use each flag's published expiry.
event_end_utc = "unknown"
api_documentation = "unknown"
own_team = "unknown"
nop_team = "1"

[scaling]
# The coordinator expands workers based on independent backlog. /brrr requests
# the full configured capacity when the live event backlog justifies it.
triggers = ["unowned service", "active attack needs reconstruction", "independent verification", "validated reproduction needs runner"]
preserve_flagkeeper = true
