<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
  <title id="title">codex-ctf agent and harness architecture</title>
  <desc id="desc">The launcher installs an isolated Codex configuration. Native Codex coordinates five specialist agents and calls OpenRouter. Workers share local evidence and handoffs. The flagkeeper uses a private ledger and submits only after an explicit user signal.</desc>
  <defs>
    <style>
      .bg{fill:#101827}.panel{fill:#172338;stroke:#34465e;stroke-width:1.5}.inner{fill:#1d3047;stroke:#496178;stroke-width:1.2}.accent{fill:#132f3c;stroke:#35c1b2;stroke-width:1.5}.gold{fill:#392f22;stroke:#dfac5e;stroke-width:1.5}.txt{fill:#edf5fa;font-family:Inter,Arial,sans-serif}.muted{fill:#adbdcc;font-family:Inter,Arial,sans-serif}.small{font-size:15px}.body{font-size:17px}.label{font-size:20px;font-weight:700}.title{font-size:29px;font-weight:750}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.line{fill:none;stroke:#79a7bb;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d9a85e;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#goldarrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#79a7bb"/></marker>
    <marker id="goldarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#d9a85e"/></marker>
  </defs>
  <rect class="bg" width="1120" height="780"/>
  <text class="txt title" x="44" y="54">codex-ctf architecture</text>
  <text class="muted body" x="44" y="83">Native Codex runs the agents. This repository provides the configuration and local workflow.</text>

  <rect class="panel" x="44" y="117" width="244" height="94" rx="14"/>
  <text class="txt label" x="62" y="151">User + launcher</text>
  <text class="muted small mono" x="62" y="177">./codex-ctf</text>
  <text class="muted small" x="62" y="196">Select workspace and profile</text>
  <path class="line" d="M288 164 H324"/>

  <rect class="panel" x="326" y="117" width="305" height="94" rx="14"/>
  <text class="txt label" x="345" y="151">Isolated CODEX_HOME</text>
  <text class="muted small" x="345" y="178">OpenRouter config, roles, skills,</text>
  <text class="muted small" x="345" y="197">prompts and task profiles</text>

  <rect class="accent" x="670" y="117" width="406" height="94" rx="14"/>
  <text class="txt label" x="689" y="151">OpenRouter Responses API</text>
  <text class="muted small" x="689" y="178">Selected model for coordinator and workers</text>
  <text class="muted small" x="689" y="197">No automatic provider or model fallback</text>

  <path class="line" d="M476 211 V246"/>
  <path class="line" d="M993 250 V213"/>
  <path class="line" d="M1022 211 V248"/>
  <rect class="panel" x="44" y="250" width="1032" height="294" rx="19"/>
  <text class="txt label" x="65" y="286">Native Codex CLI harness</text>
  <text class="muted small" x="65" y="309">Agent loop, tool calls, sessions, compaction and native delegation</text>

  <rect class="accent" x="66" y="336" width="281" height="174" rx="13"/>
  <text class="txt label" x="86" y="372">Primary coordinator</text>
  <text class="muted small" x="86" y="401">Assigns scoped work and relays alerts</text>
  <text class="muted small" x="86" y="426">Tracks roster and shared findings</text>
  <text class="muted small" x="86" y="451">One code/deployment writer</text>
  <text class="muted small" x="86" y="476">per service</text>
  <path class="line" d="M347 421 H378"/>

  <rect class="inner" x="380" y="335" width="669" height="175" rx="13"/>
  <text class="txt label" x="401" y="370">Native specialists</text>
  <text class="muted small" x="801" y="369">Team profile only</text>
  <rect class="panel" x="402" y="389" width="191" height="44" rx="8"/><text class="txt body" x="417" y="417">Traffic + Docker logs</text>
  <rect class="panel" x="604" y="389" width="202" height="44" rx="8"/><text class="txt body" x="619" y="417">Code review + PoC</text>
  <rect class="gold" x="817" y="389" width="210" height="44" rx="8"/><text class="txt body" x="835" y="417">Flagkeeper</text>
  <text class="muted small" x="402" y="463">Five children at startup; expand toward 20 for distinct tasks</text>
  <text class="muted small" x="402" y="486">Other profiles use one agent</text>

  <path class="line" d="M215 510 V580"/>
  <path class="line" d="M699 510 V580"/>
  <path class="line" d="M921 510 V580"/>
  <rect class="panel" x="44" y="584" width="328" height="111" rx="14"/>
  <text class="txt label" x="63" y="620">Local service workspace</text>
  <text class="muted small mono" x="63" y="646">source/ · evidence/raw/</text>
  <text class="muted small" x="63" y="673">Private, ignored challenge inputs</text>

  <rect class="panel" x="394" y="584" width="333" height="111" rx="14"/>
  <text class="txt label" x="413" y="620">Shared handoffs</text>
  <text class="muted small mono" x="413" y="646">coordination/ · findings/</text>
  <text class="muted small" x="413" y="673">Evidence, finding IDs and patch status</text>

  <rect class="gold" x="749" y="584" width="327" height="111" rx="14"/>
  <text class="txt label" x="768" y="620">Private flag ledger</text>
  <text class="muted small mono" x="768" y="646">flags/inbox/ → SQLite</text>
  <text class="muted small" x="768" y="673">Deduplication, expiry and receipts</text>
  <path class="dash" d="M912 695 V717"/>
  <text class="muted small" x="912" y="751" text-anchor="middle">Submit only on user signal + configured API</text>
</svg>
