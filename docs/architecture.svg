.m{fill:none;stroke:#0969da;stroke-width:1.5}
.md{fill:none;stroke:#0969da;stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
.ah{fill:#59636e}
@media (prefers-color-scheme: dark){
.t{fill:#e6edf3}
.s,.l,.h{fill:#9198a1}
.b,.c{stroke:#6e7681}
.a{stroke:#9198a1}
.ah{fill:#9198a1}
.m,.md{stroke:#4493f8}
}
</style>
<defs>
