<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>codex-ctf architecture</title>
<style>
.t{fill:#1f2328;font-size:13px;font-weight:600}
.s{fill:#59636e;font-size:11px}
.l{fill:#59636e;font-size:10px;font-style:italic}
.h{fill:#59636e;font-size:10.5px;font-weight:600;letter-spacing:.08em}
.b{fill:none;stroke:#8c959f;stroke-width:1.2}
.c{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:5 4}
